# уровень «Заказы». Посев песочницы демо (app/demo_package.py) кладёт эти позиции строками
# раскладки нового проекта. Вид и объект названы путями объектов, как «archmap-node» в
# остальных файлах пакета; view: null — корень проекта. Только координаты: раскрытие
# контейнеров сюда не входит. Объекта с таким путём в проекте нет — позиция пропускается.
# Архив знания раскладку не возит: файл живёт только в демо-пакете, и
# scripts/refresh-demo-template.py сохраняет его при обновлении пакета.
