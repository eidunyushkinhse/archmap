# Зеркало локального pre-commit-гейта (scripts/git-hooks/pre-commit):
# фронт — tsc + eslint + vitest, бэк — ruff + pytest (in-memory SQLite, сервисы не нужны).
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx vitest run

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
