# Зеркало локального pre-commit-гейта (scripts/git-hooks/pre-commit):
# фронт — tsc + eslint + vitest, бэк — ruff + mypy + pytest (in-memory SQLite, сервисы не нужны),
# mcp — ruff + mypy + pytest (тесты идут поверх подменённого транспорта httpx).
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx vitest run

  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    env:
      # Тестовые значения для fail-fast конфига: тесты на in-memory SQLite, реальная
      # БД не нужна, но Settings() требует SECRET_KEY (>=32) и DATABASE_URL при импорте.
      SECRET_KEY: ci-test-secret-key-not-for-production-0000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app/
      - name: Tests
        run: python -m pytest -q

  mcp:
    name: MCP (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q
