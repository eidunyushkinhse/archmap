# Зеркало локального pre-commit-гейта (scripts/git-hooks/pre-commit):
# фронт — tsc + eslint + vitest, бэк — ruff + mypy + pytest (in-memory SQLite, сервисы не нужны),
# mcp — ruff + mypy + pytest (тесты идут поверх подменённого транспорта httpx).
# Сверх хука (аудит 2026-10, P-18…P-20): продакшн-сборки фронта, дрейф api.gen.ts против
# app.openapi(), аудит зависимостей поставки, синтаксис скриптов поставки.
# Actions — по SHA коммита (тег в комментарии): тег можно перевесить, SHA — нет; обновляет
# их Dependabot (.github/dependabot.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет прогон устаревшего коммита.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Тестовые значения для fail-fast конфига: тесты на in-memory SQLite, реальная
  # БД не нужна, но Settings() требует SECRET_KEY (>=32) и DATABASE_URL при импорте.
  SECRET_KEY: ci-test-secret-key-not-for-production-0000
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  frontend:
    name: Frontend (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Tests и покрытие (пороги — vite.config.ts)
        run: npx vitest run --coverage --coverage.reporter=text-summary
      - name: Build (приложение и живая схема лендинга)
        run: npm run build && npm run build:embed
      - name: Мёртвый код (knip, конфиг — knip.json)
        # Экспорт, нужный только своему файлу, теряет export; ненужный нигде — удаляется
        # (аудит M16, урок фазы 8).
        run: npm run knip
      - name: Audit (только то, что едет в браузер)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app/
      - name: Tests и покрытие (порог — pyproject.toml)
        run: python -m pytest -q --cov --cov-report=term
      - name: Audit поставки (пока предупреждением)
        # Сначала наблюдаем, потом делаем блокирующим (аудит P-20): находка без исправления
        # у апстрима не должна красить main.
        continue-on-error: true
        run: pip install pip-audit && pip-audit --strict -r requirements-prod.lock

  contract:
    name: Contract (api.gen.ts против app.openapi())
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        # gen:api зовёт backend/venv/bin/python — заводим его здесь по lock поставки.
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install --require-hashes -r backend/requirements-prod.lock
          cd frontend && npm ci
      - name: Generate and compare
        # Изменил схемы Pydantic — перегенерируй типы (CLAUDE.md); забыли — красный CI.
        run: |
          cd frontend && npm run gen:api
          git diff --exit-code -- src/types/api.gen.ts

  mcp:
    name: MCP (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp/requirements.txt
            mcp/requirements-dev.txt
      - name: Install dependencies
        # Инструменты гейта — по пинам requirements-dev.txt, как в локальном venv (P-5).
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q

  scripts:
    name: Scripts (bash -n + shellcheck + ruff + agent-docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Синтаксис shell-скриптов
        run: |
          for f in dev.sh stop.sh deploy/*.sh deploy/docker/*.sh deploy/docker/archmap-admin deploy/helm/*.sh scripts/*.sh scripts/git-hooks/pre-commit; do
            bash -n "$f" || exit 1
          done
      - name: shellcheck (ошибки)
        # Только уровень error: предупреждения разбираются отдельно, не лавиной в гейт (M13).
        run: shellcheck --severity=error dev.sh stop.sh deploy/*.sh deploy/docker/*.sh deploy/docker/archmap-admin deploy/helm/*.sh scripts/*.sh scripts/git-hooks/pre-commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: ruff (скрипты поставки)
        run: pip install ruff==0.17.0 && ruff check --config backend/pyproject.toml deploy/
      - name: QWEN.md собран из CLAUDE.md
        # Правила двух агентов расходились на 173 строки (аудит P-7): источник теперь один.
        run: python3 scripts/agent-docs.py --check

  compose:
    # Команда «Поставить себе» с лендинга и README: образ из исходников, база, миграции,
    # ключ подписи, первый администратор — всё, что увидит человек после docker compose up.
    name: Docker Compose (сборка образа и старт с базой)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Сборка и старт (ждёт healthcheck /ready)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Интерфейс и API отвечают
        run: |
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)" = 401
      - name: Первый администратор и вход
        run: |
          printf 'ci-admin-password-1\nci-admin-password-1\n' | docker compose exec -T archmap archmap-admin create-admin admin
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'username=admin&password=ci-admin-password-1' | grep -q access_token
      - name: Журнал контейнеров
        if: failure()
        run: docker compose logs --no-color

  helm:
    # Helm-чарт для Kubernetes: lint, манифесты по схемам Kubernetes и Gateway API (все шаблоны
    # включены), затем установка в kind — namespace со строгим Pod Security, миграции, helm test,
    # вход и обновление без смены ключа подписи (deploy/helm/e2e-kind.sh, он же локально).
    name: Helm (lint + схемы + kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Утилиты по версии и контрольной сумме
        run: |
          get() { curl -fsSL --retry 3 -o "/tmp/$1" "$2" && echo "$3  /tmp/$1" | sha256sum -c -; }
          get helm.tgz https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
          get kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          get kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform && sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          sudo install /tmp/kind /usr/local/bin/kind
      - name: helm lint
        run: helm lint deploy/helm/archmap --set database.url=postgresql://u:p@db:5432/archmap
      - name: Манифесты по схемам
        run: |
          helm template t deploy/helm/archmap --set database.url=postgresql://u:p@db:5432/archmap \
            --set ingress.enabled=true --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=gw' --set 'httpRoute.hostnames[0]=archmap.example.com' |
          kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Установка в kind
        run: deploy/helm/e2e-kind.sh
