# helm test: сервис отвечает, база доступна (/ready)
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "archmap.fullname" . }}-test
  labels:
    {{- include "archmap.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: busybox:1.36
      command: ["wget", "-q", "-O", "-", "http://{{ include "archmap.fullname" . }}:{{ .Values.service.port }}/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
