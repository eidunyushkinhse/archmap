{{- if include "archmap.ownSecret" . }}
{{- $name := include "archmap.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "archmap.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.database.existingSecret }}
  database-url: {{ required "задайте database.url (адрес PostgreSQL 15+) или database.existingSecret" .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if not .Values.secretKey.existingSecret }}
  {{- if .Values.secretKey.value }}
  secret-key: {{ .Values.secretKey.value | b64enc | quote }}
  {{- else if and $existing (index $existing.data "secret-key") }}
  {{- /* ключ, созданный при установке, переживает обновления: иначе всех выкинет из системы */}}
  secret-key: {{ index $existing.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
