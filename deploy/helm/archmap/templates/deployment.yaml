apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "archmap.fullname" . }}
  labels:
    {{- include "archmap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "archmap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "archmap.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if include "archmap.ownSecret" . }}
        # Сменился адрес базы или ключ — поды перезапускаются сами
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Проверка базы и миграции схемы до старта сервера. Несколько подов мигрируют по
        # очереди: alembic держит advisory-блокировку базы.
        - name: migrate
          image: {{ include "archmap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["true"]
          env:
            {{- include "archmap.env" . | nindent 12 }}
            - name: MIGRATE_ON_START
              value: "true"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: archmap
          image: {{ include "archmap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "archmap.env" . | nindent 12 }}
            - name: MIGRATE_ON_START
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            # /ready — ответ базы: под без связи с ней выходит из балансировки
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # Единственное место записи: загрузки больше 1 МБ буферизуются во временный файл
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
