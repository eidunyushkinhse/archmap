---
:concurrency: <%= ENV.fetch('SIDEKIQ_CONCURRENCY', 5) %>
:queues:
  - [default, 8]
  - [push, 6]
  - mailers
  - [pull]
  - [scheduler]
:scheduler:
  :schedule:
    cleanup_scheduler:
      every: ['5m', first_in: '4m']
      class: Scheduler::CleanupScheduler
    vacuum_scheduler:
      cron: '<%= Random.rand(0..59) %> 3 * * *'
      class: Scheduler::VacuumScheduler
      queue: scheduler
    # Ловушка: своя очередь класса (push) сильнее очереди записи.
    push_refresh:
      every: '1h'
      class: PushUpdateWorker
      queue: scheduler
