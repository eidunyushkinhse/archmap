x-common: &common
  restart: unless-stopped
  environment: &env
    LOG_LEVEL: info

services:
  api:
    <<: *common
    build:
      context: ./services/api
      dockerfile: Dockerfile.prod
    command: ["gunicorn", "api.wsgi", "--workers", "4"]
    environment:
      <<: *env
      DATABASE_URL: postgres://api:${API_DB_PASSWORD}@db:5432/api
      CACHE_URL: redis://cache:6379/0
      SEARCH_HOST: search
      METRICS_PORT: 9100
    depends_on:
      - db
      - worker
  worker:
    build: ./services/api
    command: celery -A api worker -Q default,emails
    environment:
      - CELERY_BROKER_URL=redis://cache:6379/1
      - DEBUG
    env_file: .env
  db:
    image: postgres:16-alpine
  cache:
    image: redis:7
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
  legacy:
    extends:
      file: common.yml
      service: base
    image: ghcr.io/example/legacy-tool:2.1
  adminer:
    image: adminer
    profiles: ["debug"]
