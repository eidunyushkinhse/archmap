# repo:
# commit:
containers:
  billing-worker:
    http: []
    workers:
    - command: celery -A billing.app worker -Q billing,invoices --concurrency 4
      queues: [billing, invoices]
      source: docker-compose.yml:22
    schedules: []
    consumers: []
  orders:
    http:
    - method: DELETE
      path: /admin/cache
      framework: FastAPI
      prefix_unresolved: true
      source: services/orders/orders/api/admin.py:6
    - method: POST
      path: /api/orders
      framework: FastAPI
      source: services/orders/orders/api/routes.py:13
    - method: GET
      path: /api/orders/{order_id}
      framework: FastAPI
      source: services/orders/orders/api/routes.py:8
    workers: []
    schedules: []
    consumers: []
  storefront:
    http: []
    workers: []
    schedules: []
    consumers: []
