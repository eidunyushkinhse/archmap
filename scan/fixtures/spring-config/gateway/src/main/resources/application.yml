server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  datasource:
    password: ${DB_PASSWORD}
    pool: ${POOL_SIZE:${POOL_DEFAULT:7}}
  cloud:
    gateway:
      routes:
        - id: orders
          uri: lb://orders
          predicates:
            - Path=/api/orders/**
  empty: {}
  nothing:
  ratio: 0.75
  enabled: true
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
server:
  port: 9090
---
spring:
  profiles: dev
logging:
  level: DEBUG
