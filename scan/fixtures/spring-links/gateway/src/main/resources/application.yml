spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: lb://orders
              predicates:
                - Path=/api/orders/**
            - id: billing
              uri: http://billing:8080
            - id: missing
              uri: lb://payments
            - id: local
              uri: http://localhost:9000
            - id: ip
              uri: http://10.0.0.5:9000
            - id: env
              uri: ${ROUTE_URL}
            - id: env-default
              uri: ${ORDERS_URL:lb://orders}
---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: billing-old
          uri: lb://billing
