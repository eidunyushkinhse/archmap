apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - collector.yaml
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      template:
        spec:
          containers:
            - name: api
              env:
              - name: COLLECTOR_ADDR
                value: "collector:4317"
              - name: DISABLE_PROFILER
                $patch: delete
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    spec:
      template:
        spec:
          containers:
            - name: web
              env:
              - name: PEER_ADDR
                value: "api:8080"
- target:
    kind: Deployment
    name: web
  patch: |-
    - op: add
      path: /spec/replicas
      value: 3
