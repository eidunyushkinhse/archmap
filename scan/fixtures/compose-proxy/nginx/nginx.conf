events {}
http {
    upstream api_backend {
        # адрес сервиса compose
        server "api:8000";
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://api_backend;
        }
        location /ui {
            proxy_pass http://web:3000;
        }
        location /pay {
            proxy_pass https://payments.example.com;
        }
    }
}
