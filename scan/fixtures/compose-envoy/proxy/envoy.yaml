static_resources:
  listeners:
    - name: main
      address:
        socket_address:
          address: frontend
          port_value: 8080
  clusters:
    - name: frontend
      type: STRICT_DNS
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FRONTEND_HOST}
                      port_value: 3000
    - name: api
      type: STRICT_DNS
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${API_HOST:-backend}
                      port_value: 8000
    - name: api-legacy
      type: STRICT_DNS
      hosts:
        - socket_address:
            address: api
            port_value: 8001
    - name: local-stats
      type: STATIC
      load_assignment:
        cluster_name: local-stats
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9901
    - name: admin
      type: STRICT_DNS
      load_assignment:
        cluster_name: admin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${ADMIN_HOST}
                      port_value: 9000
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
